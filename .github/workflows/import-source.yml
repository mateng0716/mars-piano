name: Import complete piano source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand deployed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ -e .github/IMPORTED_75bdf05 ]; then exit 0; fi
          tar -xzf mars-piano-full-source-75bdf05.tar.gz --exclude='.github/workflows/*'
          rm -f mars-piano-full-source.tar.gz mars-piano-full-source-75bdf05.tar.gz
          touch .github/IMPORTED_75bdf05
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete deployed piano source'
          git push origin HEAD:main
