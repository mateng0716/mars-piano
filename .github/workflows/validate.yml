name: Validate static site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          for script in app.js course-data.js music-data.js lesson-visuals.js piano-input.js piano-adventure.js; do
            node --check "$script"
          done
      - name: Check learning and signal behavior
        run: node scripts/check_learning.js
      - run: |
          test -f index.html
          test -f style.css
          test -f home-layout.css
          test -f assets/piano/steinway-splendid/README.md
          test "$(find assets/piano/steinway-splendid -name '*.m4a' | wc -l)" -eq 46
