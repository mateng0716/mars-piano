name: Validate static site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check course-data.js
      - run: |
          test -f index.html
          test -f style.css
          test -f assets/piano/steinway-splendid/README.md
          test "$(find assets/piano/steinway-splendid -name '*.m4a' | wc -l)" -eq 28
